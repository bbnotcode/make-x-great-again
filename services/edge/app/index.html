<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <title>MXGA</title>
    <script>
      // Apply persisted theme before paint to avoid a flash. Mirrors the key
      // used by the legacy pages so the choice carries across surfaces.
      (function () {
        try {
          var t = localStorage.getItem("mxga_theme");
          var dark =
            t === "dark" ||
            (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
